# =====================================================================
# Milestone 4: Secure Industrial Mosquitto MQTT Broker Configuration
# Veyra Pharma Vision Edge System
# =====================================================================

# Listener 1: Secure Mutual TLS on Port 8883
listener 8883 0.0.0.0
protocol mqtt

# Security Policy: Refuse Anonymous Connections
allow_anonymous false

# Authentication Credential File
password_file /etc/mosquitto/passwd

# TLS Certificates & Cryptography
cafile /etc/mosquitto/certs/ca.crt
certfile /etc/mosquitto/certs/server.crt
keyfile /etc/mosquitto/certs/server.key
tls_version tlsv1.3

# Ciphersuite Enforcing High Security
ciphers_tls1.3 TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256

# Persistence & Audit Logging
persistence true
persistence_location /var/lib/mosquitto/
log_dest file /var/log/mosquitto/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
